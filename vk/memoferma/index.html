<style>
/* Layout: one-screen toy — coins header, 4-column farm of pads you drag creatures across, chunky action bar at the bottom; reveals and shop slide up as cards */
:root{
  --deep:#1c0d33; --plum:#3b1466; --pad:rgba(255,255,255,.07); --line:rgba(255,255,255,.14);
  --fg:#fff8ff; --muted:#c9b6e6; --pink:#ff4fb5; --lemon:#ffe14a; --cyan:#43e6ff; --lime:#8dff6a;
  --common:#a99bc4; --rare:#43a6ff; --epic:#c06bff; --legend:#ffcf3a;
  --display:"Rubik Mono One","Arial Black",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--deep);color:var(--fg);font-family:var(--body);font-weight:800;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible{outline:3px solid var(--lemon);outline-offset:2px}
#app{position:relative;max-width:460px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(80% 50% at 20% 0%,rgba(255,79,181,.35),transparent 60%),radial-gradient(70% 40% at 100% 100%,rgba(67,230,255,.25),transparent 60%),linear-gradient(var(--plum),var(--deep))}
.top{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 8px;display:grid;gap:4px;text-align:center}
.coins{font-family:var(--display);font-size:34px;color:var(--lemon);text-shadow:0 3px 0 #b8620a,0 0 26px rgba(255,225,74,.45);font-variant-numeric:tabular-nums;line-height:1.05}
.rate{color:var(--muted);font-size:15px}
.rate b{color:var(--lime)}
.boost{color:var(--pink)}
.board{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px 16px;align-content:center;touch-action:none}
.cell{aspect-ratio:1;border-radius:22px;background:var(--pad);border:2px dashed var(--line);position:relative;display:grid;place-items:center}
.cell.hot{border-color:var(--lemon);background:rgba(255,225,74,.12)}
.cr{position:relative;width:86%;height:86%;border-radius:20px;display:grid;place-items:center;animation:wob 2.4s ease-in-out infinite;touch-action:none}
.cr .b{font-size:clamp(30px,10vw,46px);line-height:1;filter:drop-shadow(0 4px 0 rgba(0,0,0,.25))}
.cr .a{position:absolute;right:2%;top:0;font-size:clamp(16px,5.4vw,24px);transform:rotate(14deg)}
.cr .lv{position:absolute;left:4px;bottom:4px;font-family:var(--display);font-size:10px;padding:2px 5px;border-radius:7px;background:rgba(0,0,0,.45)}
.t0{background:radial-gradient(circle at 50% 35%,rgba(169,155,196,.35),rgba(169,155,196,.08))}
.t1{background:radial-gradient(circle at 50% 35%,rgba(67,166,255,.45),rgba(67,166,255,.1));box-shadow:0 0 14px rgba(67,166,255,.35)}
.t2{background:radial-gradient(circle at 50% 35%,rgba(192,107,255,.55),rgba(192,107,255,.12));box-shadow:0 0 18px rgba(192,107,255,.45)}
.t3{background:radial-gradient(circle at 50% 35%,rgba(255,207,58,.65),rgba(255,207,58,.15));box-shadow:0 0 24px rgba(255,207,58,.6)}
@keyframes wob{50%{transform:translateY(-3px) rotate(-2deg) scale(1.03)}}
.cr.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.3)}100%{transform:scale(1)}}
.cr.tap{animation:tapb .18s}
@keyframes tapb{50%{transform:scale(.9)}}
.ghost{position:absolute;z-index:20;pointer-events:none;width:80px;height:80px;transform:translate(-50%,-60%) scale(1.15);animation:none}
.bar{padding:8px 16px calc(14px + env(safe-area-inset-bottom,0px));display:grid;gap:10px}
.egg{background:linear-gradient(var(--lemon),#ffb21f);color:#3a1d00;border-radius:22px;padding:14px;font-size:20px;box-shadow:0 6px 0 #b8620a,0 10px 24px rgba(255,178,31,.35);display:flex;justify-content:center;gap:10px;align-items:center}
.egg:active{transform:translateY(3px);box-shadow:0 3px 0 #b8620a}
.egg small{font-size:15px;opacity:.8}
.egg[disabled]{filter:grayscale(.6);opacity:.6}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sb{background:rgba(255,255,255,.1);border:2px solid var(--line);border-radius:18px;padding:10px 6px;font-size:13px;display:grid;justify-items:center;gap:2px;position:relative}
.sb i{font-style:normal;font-size:22px}
.sb.ad{border-color:var(--pink);background:rgba(255,79,181,.15)}
.dot{position:absolute;top:-5px;right:-5px;width:14px;height:14px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 3px var(--deep)}
#ov{position:absolute;inset:0;z-index:30;background:rgba(10,4,20,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-height:92%;overflow-y:auto;background:linear-gradient(#3a1466,#22103d);border:2px solid var(--line);border-radius:28px;padding:18px;display:grid;gap:12px;animation:up .28s cubic-bezier(.2,1.3,.4,1)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;text-align:center;line-height:1.2;text-wrap:balance}
.big{display:grid;justify-items:center;gap:6px;text-align:center}
.big .cr{width:150px;height:150px;animation:pop .6s cubic-bezier(.2,1.6,.4,1),wob 2.4s 0.6s ease-in-out infinite}
.big .cr .b{font-size:92px}.big .cr .a{font-size:44px}
.say{font-family:var(--display);color:var(--pink);font-size:18px}
.m{color:var(--muted);font-size:14px;font-weight:600}
.btn{background:rgba(255,255,255,.12);border:2px solid var(--line);border-radius:18px;padding:13px;font-size:16px;text-align:center}
.btn.main{background:linear-gradient(var(--lemon),#ffb21f);color:#3a1d00;border-color:transparent;box-shadow:0 5px 0 #b8620a}
.btn.ad{background:linear-gradient(var(--pink),#d4247f);border-color:transparent;box-shadow:0 5px 0 #8e0f50}
.btn[disabled]{opacity:.45}
.btn small{display:block;font-size:13px;opacity:.85;font-weight:600}
.coll{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.coll .it{background:rgba(255,255,255,.06);border-radius:18px;padding:8px 4px;display:grid;justify-items:center;gap:4px;font-size:12px;text-align:center}
.coll .cr{width:64px;height:64px;animation:none}
.coll .cr .b{font-size:36px}.coll .cr .a{font-size:18px}
.coll .unk .b,.coll .unk .a{filter:brightness(0) opacity(.5)}
.ufo{position:absolute;z-index:15;top:18%;font-size:44px;filter:drop-shadow(0 0 14px var(--cyan));animation:fly 9s linear forwards}
@keyframes fly{from{left:-60px}to{left:110%}}
.flt{position:absolute;z-index:16;pointer-events:none;font-family:var(--display);font-size:14px;color:var(--lime);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.spark{position:absolute;z-index:16;pointer-events:none;width:8px;height:8px;border-radius:50%}
#toast{position:absolute;left:50%;top:calc(90px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;pointer-events:none;background:var(--fg);color:var(--deep);padding:10px 14px;border-radius:14px;width:max-content;max-width:calc(100% - 32px);text-align:center;font-size:14px}
#adov{position:absolute;inset:0;z-index:50;background:#000;display:grid;place-items:center;text-align:center;padding:24px;font-size:15px}
#adov b{font-family:var(--display);font-size:46px;display:block;color:var(--lemon);margin-bottom:8px}
.hint{background:var(--lemon);color:#3a1d00;border-radius:16px;padding:10px 12px;font-size:14px;margin:0 16px;text-align:center}
.row.vk4{grid-template-columns:repeat(4,1fr)}
.snd{position:absolute;right:12px;top:calc(10px + env(safe-area-inset-top,0px));font-size:18px;background:rgba(255,255,255,.1);border-radius:12px;padding:4px 8px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

</div>

<script>
/* ===== VK Bridge (Игры ВКонтакте) — тот же интерфейс, что у общее/ysdk.js ===== */
/* Подставляется сборщиком (собрать-релиз.py --vk) вместо копии ysdk.js. Рядом — vk-bridge.min.js (локально, без CDN).
   Интерфейс для игры: YSDK.init(onMute) · ready() · start() · stop() · lang() · fullscreen() · rewarded(cb, el) · save(k, d) · load(k).
   Соцмеханики (только VK): YSDK.isVK · share(text) → пост на стену со ссылкой на приложение · invite() → окно «пригласить друзей».
   В ysdk.js (Яндекс) их нет — игра проверяет `typeof YSDK!=='undefined' && YSDK.isVK`, кнопки показывает только в VK.
   Вне VK (bridge не отвечает) — всё через localStorage, реклама за награду — экран-заглушка, ошибок нет.
   Сохранения VK: VKWebAppStorageSet/Get, значение ≤ 4096 байт → режем на куски <ключ>_0..<ключ>_N-1 + <ключ>_n (число кусков). */
const YSDK = {
  sdk: null, player: null, vk: false, onMute: () => {},
  _cache: {}, _pend: {}, _timer: {}, _last: {},
  _send(method, params, ms) {
    const b = window.vkBridge;
    if (!b || !b.send) return Promise.reject(new Error('no bridge'));
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('timeout ' + method)), ms || 3000);
      let p; try { p = b.send(method, params || {}); } catch (e) { clearTimeout(t); return rej(e); }
      Promise.resolve(p).then(r => { clearTimeout(t); res(r); }, e => { clearTimeout(t); rej(e); });
    });
  },
  async init(onMute) {
    this.onMute = onMute || (() => {});
    this.sdk = { platform: 'vk' }; // всегда «есть», чтобы игра спросила язык у обёртки (lang берётся из параметров запуска)
    try {
      const b = window.vkBridge;
      if (b && !(b.isStandalone && b.isStandalone())) {
        const r = await this._send('VKWebAppInit', {}, 2500);
        this.vk = !!(r && r.result !== false);
      }
    } catch (e) { this.vk = false; }
    document.addEventListener('visibilitychange', () => { if (document.hidden) this._flushAll(); });
  },
  get isVK() { return !!this.vk; }, // true только если VKWebAppInit прошёл (вне VK — false, соц-кнопок нет)
  appId() { try { return new URLSearchParams(location.search).get('vk_app_id') || ''; } catch (e) { return ''; } },
  async share(text) { // пост на стену: текст + ссылка на приложение; true — опубликован
    if (!this.vk) return false;
    const p = { message: String(text || '') }, id = this.appId();
    if (/^\d+$/.test(id)) p.attachments = 'https://vk.com/app' + id;
    try { const r = await this._send('VKWebAppShowWallPostBox', p, 600000); return !!(r && r.post_id); } catch (e) { return false; }
  },
  async invite() { // окно приглашения друзей; true — окно отработало без ошибки (закрыл/отменил — false)
    if (!this.vk) return false;
    try { const r = await this._send('VKWebAppShowInviteBox', {}, 600000); return !!(r && r.success !== false); } catch (e) { return false; }
  },
  ready() {}, start() {}, stop() {}, // в VK нет аналога Game Ready / GameplayAPI
  lang() {
    try {
      const v = new URLSearchParams(location.search).get('vk_language');
      if (v === null || v === '') return null; // нет параметра — игра возьмёт navigator.language
      return (v === '0' || v.toLowerCase().slice(0, 2) === 'ru') ? 'ru' : 'en';
    } catch (e) { return null; }
  },
  async _ad(format) {
    if (!this.vk) return false;
    try {
      const c = await this._send('VKWebAppCheckNativeAds', { ad_format: format }, 5000);
      if (!c || !c.result) return false;
    } catch (e) { return false; }
    this.onMute(true);
    try {
      const r = await this._send('VKWebAppShowNativeAds', { ad_format: format }, 120000);
      return !!(r && r.result);
    } catch (e) { return false; }
    finally { this.onMute(false); }
  },
  fullscreen() { return this._ad('interstitial'); },
  rewarded(cb, el) {
    if (!this.vk) { // заглушка вне VK
      let n = 3; this.onMute(true);
      if (!el) { this.onMute(false); return cb(); }
      const txt = this.lang() === 'en' ? 'A rewarded ad will play here' : 'Здесь будет реклама за награду';
      el.innerHTML = `<div><b>${n}</b>${txt}</div>`; el.hidden = false;
      const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); el.hidden = true; this.onMute(false); cb(); } else el.querySelector('b').textContent = n; }, 650);
      return;
    }
    this._ad('reward').then(ok => { if (ok) cb(); });
  },
  _chunks(s) { // режем строку на куски ≤ 4000 байт UTF-8 (лимит VK — 4096)
    const out = []; let cur = '', bytes = 0;
    for (const ch of s) {
      const c = ch.codePointAt(0), b = c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
      if (bytes + b > 4000) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur); return out;
  },
  async _write(k) {
    const s = this._pend[k]; delete this._pend[k]; this._last[k] = Date.now();
    if (s === undefined) return;
    const parts = this._chunks(s), cache = this._cache[k] || (this._cache[k] = {});
    try {
      await Promise.all(parts.map((v, i) => cache[i] === v ? null :
        this._send('VKWebAppStorageSet', { key: (k + '_' + i).slice(0, 100), value: v }).then(() => { cache[i] = v; })));
      if (cache.n !== parts.length) { await this._send('VKWebAppStorageSet', { key: k + '_n', value: String(parts.length) }); cache.n = parts.length; }
    } catch (e) { this._cache[k] = {}; }
  },
  _flushAll() { for (const k in this._pend) { clearTimeout(this._timer[k]); this._timer[k] = null; this._write(k); } },
  async save(k, d) {
    const s = JSON.stringify(d);
    try { localStorage.setItem(k, s); } catch (e) {}
    if (!this.vk) return;
    this._pend[k] = s;
    const wait = 4000 - (Date.now() - (this._last[k] || 0)); // в VK не чаще раза в 4 с (лимиты), при сворачивании — сразу
    if (wait <= 0 || document.hidden) { clearTimeout(this._timer[k]); this._timer[k] = null; return this._write(k); }
    if (!this._timer[k]) this._timer[k] = setTimeout(() => { this._timer[k] = null; this._write(k); }, wait);
  },
  async load(k) {
    if (this.vk) {
      try {
        const g = async keys => { const r = await this._send('VKWebAppStorageGet', { keys }); const m = {}; for (const x of (r && r.keys) || []) m[x.key] = x.value; return m; };
        const n = parseInt((await g([k + '_n']))[k + '_n'], 10);
        if (n > 0) {
          const keys = Array.from({ length: n }, (_, i) => k + '_' + i), m = await g(keys);
          if (keys.every(x => typeof m[x] === 'string')) {
            const cache = this._cache[k] = { n }; keys.forEach((x, i) => cache[i] = m[x]);
            const d = JSON.parse(keys.map(x => m[x]).join(''));
            if (d) return d;
          }
        }
      } catch (e) {}
    }
    try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; }
  },
};

/* ===== Язык: RU/EN (язык из SDK: ysdk.environment.i18n.lang; без SDK — navigator.language) ===== */
const T={
 ru:{
  title:'Мемоферма: скрести брейнротов',sound:'Звук',buyEgg:'Купить яйцо',shop:'Улучшения',coll:'Коллекция',x2:'×2 доход',x2more:'Ещё ×2',
  perSec:'в секунду',boostLeft:s=>`🚀 ×2 ещё ${s} с`,farmFull:'ферма заполнена — скрещивай!',
  tips:['Жми «Купить яйцо» — вылупится первый брейнрот.','Купи ещё одно яйцо.','Перетащи брейнрота на такого же — они скрестятся в нового!'],

function snd(t,l=1){if(!S||!S.sound||muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const now=AC.currentTime;
 const tone=(f,f2,d,ty='sine',v=.08,at=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,now+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+at+d);g.gain.setValueAtTime(v,now+at);g.gain.exponentialRampToValueAtTime(.0001,now+at+d);o.connect(g).connect(AC.destination);o.start(now+at);o.stop(now+at+d+.02)};
 if(t==='pop'){tone(300+l*60,600+l*90,.14,'triangle',.1)}
 if(t==='tap')tone(700,900,.05,'square',.03);
 if(t==='coin'){tone(1200,1800,.08,'square',.035);tone(1600,2400,.1,'square',.035,.07)}
 if(t==='fan'){[523,659,784,1046,1318].forEach((f,i)=>tone(f,0,.18,'triangle',.08,i*.08))}
 if(t==='egg')tone(500,250,.12,'sine',.08);

function sparks(el,n=14){const app=$('app').getBoundingClientRect(),r=el.getBoundingClientRect();const cols=['#ffe14a','#ff4fb5','#43e6ff','#8dff6a'];for(let i=0;i<n;i++){const s=document.createElement('div');s.className='spark';s.style.background=cols[i%4];s.style.left=(r.left-app.left+r.width/2)+'px';s.style.top=(r.top-app.top+r.height/2)+'px';$('app').appendChild(s);const a=R(0,6.28),d=R(30,90);s.animate([{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) scale(.3)`,opacity:0}],{duration:R(400,750),easing:'ease-out'}).onfinish=()=>s.remove()}}

function spawn(level){const free=S.cells.map((l,i)=>l?-1:i).filter(i=>i>=0);if(!free.length)return -1;const i=free[Math.floor(Math.random()*free.length)];S.cells[i]=level;ui.popI=i;return i}
function discover(l){if(!S.disc.includes(l)){S.disc.push(l);if(l>1)setTimeout(()=>showDiscover(l),250)}}
function buyEgg(){
  const p=eggPrice();if(S.coins<p||!S.cells.includes(0)){snd('no');return}
  S.coins-=p;S.eggs++;const lvl=S.eggLvl+(Math.random()<.08?1:0);spawn(lvl);discover(lvl);snd('egg');
  if(S.tut<2)S.tut++;renderBoard();renderHUD();save();
}
function merge(from,to){
  const l=S.cells[from];if(l>=MEMES.length){toast(t('maxMeme'));return false}
  S.cells[from]=0;S.cells[to]=l+1;ui.popI=to;
  const bonus=inc(l+1)*5*S.mult;S.coins+=bonus;S.total+=bonus;
  renderBoard();const el=cellEl(to);sparks(el);floatAt(el,'+'+fmt(bonus),'#ffe14a');snd('pop',l);
  try{navigator.vibrate&&navigator.vibrate(25)}catch(e){}
  if(S.tut===2)S.tut=3;
  discover(l+1);renderHUD();save();return true;

    document.querySelectorAll('.cell.hot').forEach(x=>x.classList.remove('hot'));const t=cellAt(e);if(t!=null&&t!==d.i)cellEl(t).classList.add('hot')}
});
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.cell');return c?+c.dataset.i:null}
board.addEventListener('pointerup',e=>{
  const d=ui.drag;ui.drag=null;if(!d)return;

 off3:x=>YSDK.rewarded(()=>{S.coins+=+x*3;closeOv();snd('fan');confetti();renderHUD();save()},$('adov')),
 sound:()=>{S.sound=!S.sound;renderHUD();save()},
 vkshare:x=>vkShare(+x),vkinv:vkInvite,
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset.x)});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();try{AC&&AC.suspend()}catch(e){}YSDK.stop()}else{if(!offline())daily();YSDK.start()}});

/* ===== Старт ===== */
(async()=>{
  await YSDK.init(m=>{muted=m;try{m?AC&&AC.suspend():AC&&AC.resume()}catch(e){}});
  if(YSDK.sdk)setLang(YSDK.lang()||navigator.language);
  const d=await YSDK.load(KEY);S=d&&d.v===1?d:fresh();
  if(!S.disc.length&&S.cells.some(Boolean))S.disc=[...new Set(S.cells.filter(Boolean))];
  renderBoard();renderHUD();
  if(!offline())daily();
  YSDK.ready();YSDK.start();
  let n=0;
  setInterval(()=>{const g=income()/10;S.coins+=g;S.total+=g;if(++n%10===0){renderHUD();const filled=S.cells.map((l,i)=>l?i:-1).filter(i=>i>=0);if(filled.length&&!ui.drag){const i=filled[Math.floor(Math.random()*filled.length)];floatAt(cellEl(i),'+'+fmt(inc(S.cells[i])*S.mult))}}if(n%50===0)save()},100);
  setInterval(ufo,55000);setTimeout(ufo,20000);
})();
