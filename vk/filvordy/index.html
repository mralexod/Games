<script>
/* ===== VK Bridge (Игры ВКонтакте) — тот же интерфейс, что у общее/ysdk.js ===== */
/* Подставляется сборщиком (собрать-релиз.py --vk) вместо копии ysdk.js. Рядом — vk-bridge.min.js (локально, без CDN).
   Интерфейс для игры: YSDK.init(onMute) · ready() · start() · stop() · lang() · fullscreen() · rewarded(cb, el) · save(k, d) · load(k).
   Вне VK (bridge не отвечает) — всё через localStorage, реклама за награду — экран-заглушка, ошибок нет.
   Сохранения VK: VKWebAppStorageSet/Get, значение ≤ 4096 байт → режем на куски <ключ>_0..<ключ>_N-1 + <ключ>_n (число кусков). */
const YSDK = {
  sdk: null, player: null, vk: false, onMute: () => {},
  _cache: {}, _pend: {}, _timer: {}, _last: {},
  _send(method, params, ms) {
    const b = window.vkBridge;
    if (!b || !b.send) return Promise.reject(new Error('no bridge'));
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('timeout ' + method)), ms || 3000);
      let p; try { p = b.send(method, params || {}); } catch (e) { clearTimeout(t); return rej(e); }
      Promise.resolve(p).then(r => { clearTimeout(t); res(r); }, e => { clearTimeout(t); rej(e); });
    });
  },
  async init(onMute) {
    this.onMute = onMute || (() => {});
    this.sdk = { platform: 'vk' }; // всегда «есть», чтобы игра спросила язык у обёртки (lang берётся из параметров запуска)
    try {
      const b = window.vkBridge;
      if (b && !(b.isStandalone && b.isStandalone())) {
        const r = await this._send('VKWebAppInit', {}, 2500);
        this.vk = !!(r && r.result !== false);
      }
    } catch (e) { this.vk = false; }
    document.addEventListener('visibilitychange', () => { if (document.hidden) this._flushAll(); });
  },
  ready() {}, start() {}, stop() {}, // в VK нет аналога Game Ready / GameplayAPI
  lang() {
    try {
      const v = new URLSearchParams(location.search).get('vk_language');
      if (v === null || v === '') return null; // нет параметра — игра возьмёт navigator.language
      return (v === '0' || v.toLowerCase().slice(0, 2) === 'ru') ? 'ru' : 'en';
    } catch (e) { return null; }
  },
  async _ad(format) {
    if (!this.vk) return false;
    try {
      const c = await this._send('VKWebAppCheckNativeAds', { ad_format: format }, 5000);
      if (!c || !c.result) return false;
    } catch (e) { return false; }
    this.onMute(true);
    try {
      const r = await this._send('VKWebAppShowNativeAds', { ad_format: format }, 120000);
      return !!(r && r.result);
    } catch (e) { return false; }
    finally { this.onMute(false); }
  },
  fullscreen() { return this._ad('interstitial'); },
  rewarded(cb, el) {
    if (!this.vk) { // заглушка вне VK
      let n = 3; this.onMute(true);
      if (!el) { this.onMute(false); return cb(); }
      const txt = this.lang() === 'en' ? 'A rewarded ad will play here' : 'Здесь будет реклама за награду';
      el.innerHTML = `<div><b>${n}</b>${txt}</div>`; el.hidden = false;
      const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); el.hidden = true; this.onMute(false); cb(); } else el.querySelector('b').textContent = n; }, 650);
      return;
    }
    this._ad('reward').then(ok => { if (ok) cb(); });
  },
  _chunks(s) { // режем строку на куски ≤ 4000 байт UTF-8 (лимит VK — 4096)
    const out = []; let cur = '', bytes = 0;
    for (const ch of s) {
      const c = ch.codePointAt(0), b = c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
      if (bytes + b > 4000) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur); return out;
  },
  async _write(k) {
    const s = this._pend[k]; delete this._pend[k]; this._last[k] = Date.now();
    if (s === undefined) return;
    const parts = this._chunks(s), cache = this._cache[k] || (this._cache[k] = {});
    try {
      await Promise.all(parts.map((v, i) => cache[i] === v ? null :
        this._send('VKWebAppStorageSet', { key: (k + '_' + i).slice(0, 100), value: v }).then(() => { cache[i] = v; })));
      if (cache.n !== parts.length) { await this._send('VKWebAppStorageSet', { key: k + '_n', value: String(parts.length) }); cache.n = parts.length; }
    } catch (e) { this._cache[k] = {}; }
  },
  _flushAll() { for (const k in this._pend) { clearTimeout(this._timer[k]); this._timer[k] = null; this._write(k); } },
  async save(k, d) {
    const s = JSON.stringify(d);
    try { localStorage.setItem(k, s); } catch (e) {}
    if (!this.vk) return;
    this._pend[k] = s;
    const wait = 4000 - (Date.now() - (this._last[k] || 0)); // в VK не чаще раза в 4 с (лимиты), при сворачивании — сразу
    if (wait <= 0 || document.hidden) { clearTimeout(this._timer[k]); this._timer[k] = null; return this._write(k); }
    if (!this._timer[k]) this._timer[k] = setTimeout(() => { this._timer[k] = null; this._write(k); }, wait);
  },
  async load(k) {
    if (this.vk) {
      try {
        const g = async keys => { const r = await this._send('VKWebAppStorageGet', { keys }); const m = {}; for (const x of (r && r.keys) || []) m[x.key] = x.value; return m; };
        const n = parseInt((await g([k + '_n']))[k + '_n'], 10);
        if (n > 0) {
          const keys = Array.from({ length: n }, (_, i) => k + '_' + i), m = await g(keys);
          if (keys.every(x => typeof m[x] === 'string')) {
            const cache = this._cache[k] = { n }; keys.forEach((x, i) => cache[i] = m[x]);
            const d = JSON.parse(keys.map(x => m[x]).join(''));
            if (d) return d;
          }
        }
      } catch (e) {}
    }
    try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; }
  },
};

/* ===== Темы и слова (буква Ё заменена на Е) ===== */
const THEMES=[
 ['Дача','грядка сарай забор лейка тяпка лопата грабли теплица огород малина клубника кабачок баня колодец шланг рассада тыква укроп редис компост калитка беседка улей ведро вилы сирень яблоня'],
 ['Животные','волк лиса заяц медведь барсук енот лось кабан белка ежик бобр олень тигр слон жираф зебра лев рысь соболь крот хорек куница норка выдра пума панда коала'],
 ['На кухне','ложка вилка чашка тарелка кастрюля чайник плита духовка половник терка миска сито кружка блюдце сковорода нож доска скалка противень банка крышка холодильник'],
 ['Фрукты и ягоды','яблоко груша слива вишня черешня арбуз дыня банан апельсин лимон киви манго персик абрикос клюква брусника черника малина смородина крыжовник виноград гранат хурма инжир айва'],
 ['Города России','москва казань омск томск пермь уфа самара тула орел курск псков сочи тверь чита ярославль калуга рязань липецк брянск сургут вологда тамбов пенза кострома иваново'],
 ['Профессии','врач повар пекарь пилот юрист судья актер певец учитель столяр плотник маляр шофер кассир швея садовник летчик моряк геолог врач инженер фермер почтальон механик'],
 ['Транспорт','автобус трамвай метро поезд самолет катер лодка яхта такси велосипед мотоцикл самокат паром теплоход вертолет грузовик фургон электричка ракета карета сани'],
 ['Цветы','роза астра пион лилия тюльпан ромашка гвоздика нарцисс мак ирис флокс георгин гладиолус фиалка орхидея лютик василек колокольчик сирень жасмин мимоза лотос'],
 ['Одежда','пальто куртка шуба платье юбка брюки шорты рубашка свитер кофта шапка шарф варежки носки пиджак галстук халат пижама фартук жилет майка блузка'],
 ['Погода','дождь снег град ветер туман иней гроза радуга буран метель облако солнце жара мороз роса лужа вьюга ливень зной оттепель гололед штиль'],

 ['Овощи','морковь свекла капуста картофель лук чеснок огурец томат перец редис репа тыква кабачок баклажан горох фасоль укроп петрушка салат щавель редька патиссон'],
 ['В доме','диван кресло стул стол шкаф полка кровать комод ковер зеркало лампа люстра окно дверь штора подушка одеяло часы порог балкон кладовка прихожая'],

].map(([n,w])=>({n,w:[...new Set(w.split(' ').map(x=>x.toLowerCase().replace(/ё/g,'е')))]}));
const COLORS=['#2f8f74','#d07b2b','#5a7fc4','#b5547a','#7a9a36','#8a62b8','#c2593f','#3d93a8','#9a7b2e','#4e7f5a'];

/* ===== Генерация уровня ===== */
function rng(seed){let a=seed>>>0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const sizeFor=lv=>lv<=4?5:lv<=15?6:7;
function hamPath(n,r){
  let p=[];for(let y=0;y<n;y++)for(let x=0;x<n;x++)p.push([y%2?n-1-x:x,y]);
  for(let it=0;it<n*n*40;it++){
    if(r()<.5)p.reverse();
    const e=p[p.length-1];const nb=[[1,0],[-1,0],[0,1],[0,-1]].map(([dx,dy])=>[e[0]+dx,e[1]+dy]).filter(([x,y])=>x>=0&&y>=0&&x<n&&y<n);
    const q=nb[Math.floor(r()*nb.length)];const i=p.findIndex(c=>c[0]===q[0]&&c[1]===q[1]);
    if(i===p.length-2)continue;
    p=p.slice(0,i+1).concat(p.slice(i+1).reverse());
  }
  return p;
}
function pickWords(pool,total,r){
  for(let t=0;t<800;t++){
    const sh=pool.slice().sort(()=>r()-.5);let sum=0;const res=[];
    for(const w of sh){const rest=total-sum-w.length;if(rest===0||rest>=3){res.push(w);sum+=w.length;if(sum===total)return res}}
  }
  return null;
}
function makeLevel(lv){
  const n=sizeFor(lv),r=rng(lv*7919+13);
  const th=THEMES[(lv-1)%THEMES.length];
  let pool=th.w.filter(w=>w.length>=3&&w.length<=Math.min(9,n+3));
  let words=pickWords(pool,n*n,r);
  if(!words){pool=pool.concat(THEMES[lv%THEMES.length].w.filter(w=>w.length>=3&&w.length<=n+3));words=pickWords([...new Set(pool)],n*n,r)}
  const path=hamPath(n,r);const grid=Array(n*n).fill('');const list=[];let k=0;
  words.forEach((w,wi)=>{const cells=[];for(const ch of w){const [x,y]=path[k++];grid[y*n+x]=ch;cells.push(y*n+x)}list.push({w,cells,f:false,c:COLORS[wi%COLORS.length],h:0})});
  return{lv,n,theme:th.n,grid,words:list};
}

/* ===== Состояние ===== */
const KEY='filword_v1';
let S=null,L=null,sel=[],selecting=false;
function fresh(){return{v:1,lv:1,coins:60,stars:{},hintsUsed:0,sound:true,streak:0,realLast:null,found:[]}}
const $=id=>document.getElementById(id);
let toastT;function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>e.hidden=true,1900)}
let AC=null,muted=false;
function snd(t,k=0){if(!S||!S.sound||muted)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const now=AC.currentTime;
 const tone=(f,d,ty='sine',v=.07,at=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.setValueAtTime(f,now+at);g.gain.setValueAtTime(v,now+at);g.gain.exponentialRampToValueAtTime(.0001,now+at+d);o.connect(g).connect(AC.destination);o.start(now+at);o.stop(now+at+d+.02)};
 if(t==='step')tone(420+k*35,.07,'sine',.04);
 if(t==='ok'){tone(660,.12,'triangle');tone(880,.16,'triangle',.07,.1)}
 if(t==='no')tone(200,.18,'sine',.05);
 if(t==='win'){[523,659,784,1046].forEach((f,i)=>tone(f,.25,'triangle',.07,i*.12))}
}catch(e){}}

/* ===== Отрисовка ===== */
function render(){
  $('lvl').innerHTML=`Уровень ${L.lv}<span>Тема: ${L.theme}</span>`;
  $('coins').textContent=`🪙 ${S.coins}`;
  $('snd').textContent=S.sound?'🔊':'🔇';
  const g=$('grid');g.style.gridTemplateColumns=`repeat(${L.n},1fr)`;
  const owner={};L.words.forEach((w,i)=>{if(w.f)w.cells.forEach(c=>owner[c]=w.c)});
  const hintCells=new Set();L.words.forEach(w=>{if(!w.f)for(let i=0;i<w.h;i++)hintCells.add(w.cells[i])});
  g.innerHTML=L.grid.map((ch,i)=>`<div class="c ${owner[i]?'f':''} ${sel.includes(i)?'sel':''} ${hintCells.has(i)?'hintc':''}" data-i="${i}" style="${owner[i]?`background:${owner[i]}`:''}">${ch}</div>`).join('');
  $('words').innerHTML=L.words.map(w=>`<span class="w ${w.f?'f':''}" style="${w.f?`background:${w.c}`:''}">${w.w}</span>`).join('');
  $('cur').textContent=sel.map(i=>L.grid[i]).join('').toUpperCase();
  $('hintb').disabled=S.coins<30;
}
function paintSel(){document.querySelectorAll('.c').forEach(e=>e.classList.toggle('sel',sel.includes(+e.dataset.i)));$('cur').textContent=sel.map(i=>L.grid[i]).join('').toUpperCase()}

/* ===== Ведение пальцем ===== */
const grid=$('grid');
const adj=(a,b)=>{const n=L.n;const ax=a%n,ay=Math.floor(a/n),bx=b%n,by=Math.floor(b/n);return Math.abs(ax-bx)+Math.abs(ay-by)===1};
const taken=i=>L.words.some(w=>w.f&&w.cells.includes(i));
function cellAt(e){const el=document.elementFromPoint(e.clientX,e.clientY);const c=el&&el.closest&&el.closest('.c');return c?+c.dataset.i:null}
grid.addEventListener('pointerdown',e=>{const i=cellAt(e);if(i==null||taken(i))return;selecting=true;sel=[i];grid.setPointerCapture(e.pointerId);snd('step',0);paintSel()});
grid.addEventListener('pointermove',e=>{if(!selecting)return;const i=cellAt(e);if(i==null)return;const last=sel[sel.length-1];if(i===last)return;
  if(sel.length>1&&i===sel[sel.length-2]){sel.pop();paintSel();return}
  if(!sel.includes(i)&&adj(last,i)&&!taken(i)){sel.push(i);snd('step',sel.length);paintSel()}});
grid.addEventListener('pointerup',()=>{if(!selecting)return;selecting=false;check();});
grid.addEventListener('pointercancel',()=>{selecting=false;sel=[];render()});
function check(){
  if(sel.length<2){sel=[];render();return}
  const key=sel.join(','),rev=sel.slice().reverse().join(',');
  const w=L.words.find(x=>!x.f&&(x.cells.join(',')===key||x.cells.join(',')===rev));
  if(w){w.f=true;const gain=w.w.length*2;S.coins+=gain;snd('ok');toast(`${w.w.toUpperCase()} · +${gain} 🪙`);sel=[];render();saveProg();
    if(L.words.every(x=>x.f))setTimeout(win,500);return}
  const word=sel.map(i=>L.grid[i]).join('');
  if(L.words.some(x=>!x.f&&(x.w===word||x.w===[...word].reverse().join(''))))toast('Почти! Это слово спрятано по-другому');
  snd('no');grid.classList.remove('shake');void grid.offsetWidth;grid.classList.add('shake');sel=[];render();
}
function hint(){
  const w=L.words.filter(x=>!x.f&&x.h<x.w.length-1);if(!w.length)return false;
  const t=w.sort((a,b)=>a.h-b.h)[0];t.h++;L.hints=(L.hints||0)+1;saveProg();render();snd('step',4);return true;
}
async function win(){
  const st=(L.hints||0)===0?3:(L.hints||0)<=2?2:1;S.stars[L.lv]=Math.max(S.stars[L.lv]||0,st);const bonus=20+L.n*2;S.coins+=bonus;snd('win');
  const doneThemes=new Set();for(let i=1;i<=L.lv;i++)doneThemes.add(THEMES[(i-1)%THEMES.length].n);
  $('ov').innerHTML=`<div class="card"><h2>Уровень ${L.lv} пройден!</h2><div class="stars">${'★'.repeat(st)}<s>${'★'.repeat(3-st)}</s></div><div class="m">+${bonus} монет · всего ${S.coins} 🪙</div>
   <div class="m">Тем пройдено: ${Math.min(doneThemes.size,THEMES.length)} из ${THEMES.length}</div><div class="themes">${THEMES.map(t=>`<span class="${doneThemes.has(t.n)?'done':''}">${t.n}</span>`).join('')}</div>
   <button class="btn main" data-a="next">Дальше: уровень ${L.lv+1}<small>${THEMES[L.lv%THEMES.length].n}</small></button></div>`;
  $('ov').hidden=false;S.lv++;S.found=[];save();
}
function loadLevel(){L=makeLevel(S.lv);(S.found||[]).forEach(i=>{if(L.words[i])L.words[i].f=true});L.hints=S.lvHints||0;(S.hintArr||[]).forEach((h,i)=>{if(L.words[i])L.words[i].h=h});sel=[];render()}
function saveProg(){S.found=L.words.map((w,i)=>w.f?i:-1).filter(i=>i>=0);S.lvHints=L.hints||0;S.hintArr=L.words.map(w=>w.h);save()}
function save(){YSDK.save(KEY,S)}
function daily(){const d=new Date(),today=d.toISOString().slice(0,10),y=new Date(d-864e5).toISOString().slice(0,10);if(S.realLast===today)return;
  S.streak=S.realLast===y?S.streak+1:1;S.realLast=today;if(S.lv<2)return;const g=20*Math.min(7,S.streak);S.coins+=g;save();
  $('ov').innerHTML=`<div class="card"><h2>С возвращением!</h2><div style="font-size:56px">🎁</div><div class="m">Подарок за ${S.streak}-й день подряд: <b>+${g} монет</b>.<br>Заходите каждый день — подарок растёт.</div><button class="btn main" data-a="close">Спасибо</button></div>`;$('ov').hidden=false}

const A={
 hint:()=>{if(S.coins<30)return toast('Не хватает монет — возьмите подсказку за рекламу');if(hint()){S.coins-=30;render();save()}},
 adhint:()=>YSDK.rewarded(()=>{hint()},$('adov')),
 next:async()=>{$('ov').hidden=true;if((S.lv-1)%2===0)await YSDK.fullscreen();S.lvHints=0;S.hintArr=[];loadLevel();save()},
 close:()=>{$('ov').hidden=true},
 sound:()=>{S.sound=!S.sound;render();save()},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset.x)});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();try{AC&&AC.suspend()}catch(e){}YSDK.stop()}else YSDK.start()});

(async()=>{
  await YSDK.init(m=>{muted=m;try{m?AC&&AC.suspend():AC&&AC.resume()}catch(e){}});
  const d=await YSDK.load(KEY);S=d&&d.v===1?d:fresh();
  loadLevel();daily();YSDK.ready();YSDK.start();
  if(S.lv===1&&!S.found.length)toast('Ведите пальцем по соседним буквам, чтобы собрать слово');
})();
</script>

</body>
