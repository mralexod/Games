<style>
/* Layout: newspaper scanword for 35–60+ — header with level/theme/coins, thin progress bar, square grid (clue cells with arrows + letter cells),
   big "current question" bar, two hint buttons, large on-screen ЙЦУКЕН keyboard. Landscape desktop: grid left, controls right. */
:root{
  --bg:#e9e3d6; --paper:#fffdf8; --ink:#1f2a33; --muted:#66707a; --blue:#2b5f8f; --blue-d:#1f4a72; --line:#9aa6b2; --gold:#e0a21f;
  --clue:#dde9f4; --clue-ink:#22384d; --act:#fff1c2; --cur:#ffd45c; --ok:#2f8f5c; --bad:#d9534f;
  --serif:"PT Serif",Georgia,serif; --sans:"PT Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cs:48px; --kh:50px;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) 16px calc(10px + env(safe-area-inset-bottom,0px));gap:8px;overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;grid-area:top}
.lvl{font-family:var(--serif);font-size:23px;line-height:1.1;white-space:nowrap}
.sub{display:flex;align-items:center;gap:10px;grid-area:prog}
#theme,#streak{font-size:16px;font-weight:700;color:var(--muted);white-space:nowrap}
.tr{display:flex;gap:6px;align-items:center;flex-shrink:0}
.pill{background:var(--paper);border:2px solid #d3cbb8;border-radius:999px;padding:5px 11px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap}
.daybtn{background:var(--blue);border-color:var(--blue);color:#fff;position:relative}
.daybtn.new::after{content:"";position:absolute;top:-3px;right:-3px;width:12px;height:12px;border-radius:50%;background:#e8483f;border:2px solid var(--paper)}
.prog{flex:1;height:10px;border-radius:99px;background:#d6cfbf;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ok),#4fb37c);border-radius:99px;transition:width .5s ease}
.board{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;grid-area:board}
.grid{display:grid;gap:2px;background:#5d6b78;border:2px solid #5d6b78;border-radius:6px;touch-action:manipulation}
.c{width:var(--cs);height:var(--cs);position:relative;overflow:hidden;background:var(--paper)}
.c.lt{display:grid;place-items:center;cursor:pointer}
.c.lt b{font-weight:700;font-size:calc(var(--cs)*.6);line-height:1;color:var(--ink);text-transform:uppercase}
.c.lt.aw{background:var(--act)}
.c.lt.ac{background:var(--cur);box-shadow:inset 0 0 0 3px #c98a00}
.c.lt.ok b{color:var(--ok)}
.c.lt.hn b{color:var(--blue)}
.c.lt.bad b{color:var(--bad)}
.c.lt.bad{animation:shake .35s}
.c.lt.pop{animation:pop .5s ease both}
.c.lt.wave{animation:wave .7s ease both}
.c.cq{background:var(--clue);display:flex;flex-direction:column;cursor:pointer}
.qx{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:1px 2px;color:var(--clue-ink);font-size:calc(var(--cs)*.2);line-height:1.05;overflow:hidden;overflow-wrap:normal;hyphens:manual}
.qx.tight{overflow-wrap:anywhere}
.qx+.qx{border-top:1.5px solid #9fb4c8}
.qx.act{background:var(--cur);color:#3a2a00}
.qx.done{color:#9aabba}
.c.bx{background:repeating-linear-gradient(45deg,#cfc6b2 0 4px,#ddd5c3 4px 8px)}
.ar{position:absolute;color:#2b5f8f;font-size:calc(var(--cs)*.2);line-height:1;pointer-events:none}
.ar.R{left:1px;top:50%;transform:translateY(-50%)}
.ar.D{top:0;left:50%;transform:translateX(-50%)}
.ar.RD{left:1px;top:1px}
.ar.DR{top:1px;left:1px}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.18);background:#bfe8cf}100%{transform:scale(1)}}
@keyframes wave{0%{transform:scale(1)}35%{transform:scale(1.15) rotate(-4deg);background:#9fdcb7}100%{transform:scale(1)}}
.side{display:flex;flex-direction:column;gap:8px;grid-area:side}
.q{display:flex;align-items:center;gap:6px;background:var(--paper);border:2px solid #d3cbb8;border-radius:16px;padding:6px;min-height:62px}
.q .nav{width:40px;height:44px;border-radius:12px;background:#efe9dc;font-size:22px;font-weight:700;flex-shrink:0}
#qt{flex:1;text-align:center;font-size:20px;font-weight:700;line-height:1.15;text-wrap:balance}
#qt small{display:block;font-weight:400;font-size:15px;color:var(--muted)}
#qt .dir{color:var(--blue)}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{background:var(--paper);border:2px solid #d3cbb8;border-radius:16px;padding:9px 8px;font-weight:700;font-size:17px;text-align:center;line-height:1.15}
.btn small{display:block;font-weight:400;font-size:14px;color:var(--muted)}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.main small{color:#d5e5f5}
.btn[disabled]{opacity:.45}
.kb{display:flex;flex-direction:column;gap:6px}
.kr{display:flex;gap:4px}
.k{flex:1;min-width:0;height:var(--kh);border-radius:9px;background:var(--paper);box-shadow:0 2px 0 #c4baa5;font-weight:700;font-size:21px;display:grid;place-items:center}
.k.pr{background:var(--cur);transform:translateY(1px);box-shadow:none}
.k.bs{flex:1.7;font-size:20px;background:#efe9dc}
#ov{position:absolute;inset:0;z-index:20;background:rgba(31,42,51,.5);display:flex;align-items:center;justify-content:center;padding:16px}
.card{width:100%;max-width:440px;background:var(--paper);border-radius:24px;padding:22px;display:grid;gap:12px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:up .3s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.3}}
.card h2{font-family:var(--serif);font-size:27px;margin:0;color:var(--blue-d);text-wrap:balance}
.stars{font-size:40px;letter-spacing:6px;color:var(--gold)}
.stars s{color:#d8d2c4;text-decoration:none}
.m{color:var(--muted);font-size:17px;line-height:1.35}
.m b{color:var(--ink)}
.chest{display:flex;gap:6px;justify-content:center;align-items:center;font-size:15px;color:var(--muted)}
.chest i{width:26px;height:12px;border-radius:6px;background:#e3dccd}
.chest i.f{background:var(--gold)}
.big{font-size:54px;line-height:1}
#toast{position:absolute;left:50%;top:38%;transform:translateX(-50%);z-index:30;pointer-events:none;background:var(--ink);color:#fff;padding:12px 16px;border-radius:14px;font-size:18px;width:max-content;max-width:calc(100% - 32px);text-align:center}
#adov{position:absolute;inset:0;z-index:40;background:#000;color:#fff;display:grid;place-items:center;text-align:center;padding:24px;font-size:16px}
#adov b{font-size:46px;display:block;margin-bottom:8px;color:var(--gold)}
#conf{position:absolute;inset:0;z-index:25;pointer-events:none;overflow:hidden}
#conf i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.snd{font-size:18px;background:var(--paper);border:2px solid #d3cbb8;border-radius:12px;padding:4px 7px}
@media (min-width:900px) and (min-aspect-ratio:5/4){
  #app{max-width:1180px;display:grid;grid-template-columns:minmax(0,1fr) 430px;grid-template-rows:auto auto minmax(0,1fr);grid-template-areas:"top top" "prog prog" "board side";column-gap:24px;row-gap:10px}
  .side{justify-content:center}
  #qt{font-size:24px}
  .k{font-size:24px}
  :root{--kh:60px}
}
@media (max-height:700px) and (max-aspect-ratio:5/4){:root{--kh:44px} .q{min-height:54px} #qt{font-size:18px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

</div>

<script>
/* ===== VK Bridge (Игры ВКонтакте) — тот же интерфейс, что у общее/ysdk.js ===== */
/* Подставляется сборщиком (собрать-релиз.py --vk) вместо копии ysdk.js. Рядом — vk-bridge.min.js (локально, без CDN).
   Интерфейс для игры: YSDK.init(onMute) · ready() · start() · stop() · lang() · fullscreen() · rewarded(cb, el) · save(k, d) · load(k).
   Соцмеханики (только VK): YSDK.isVK · share(text) → пост на стену со ссылкой на приложение · invite() → окно «пригласить друзей».
   В ysdk.js (Яндекс) их нет — игра проверяет `typeof YSDK!=='undefined' && YSDK.isVK`, кнопки показывает только в VK.
   Вне VK (bridge не отвечает) — всё через localStorage, реклама за награду — экран-заглушка, ошибок нет.
   Сохранения VK: VKWebAppStorageSet/Get, значение ≤ 4096 байт → режем на куски <ключ>_0..<ключ>_N-1 + <ключ>_n (число кусков). */
const YSDK = {
  sdk: null, player: null, vk: false, onMute: () => {},
  _cache: {}, _pend: {}, _timer: {}, _last: {},
  _send(method, params, ms) {
    const b = window.vkBridge;
    if (!b || !b.send) return Promise.reject(new Error('no bridge'));
    return new Promise((res, rej) => {
      const t = setTimeout(() => rej(new Error('timeout ' + method)), ms || 3000);
      let p; try { p = b.send(method, params || {}); } catch (e) { clearTimeout(t); return rej(e); }
      Promise.resolve(p).then(r => { clearTimeout(t); res(r); }, e => { clearTimeout(t); rej(e); });
    });
  },
  async init(onMute) {
    this.onMute = onMute || (() => {});
    this.sdk = { platform: 'vk' }; // всегда «есть», чтобы игра спросила язык у обёртки (lang берётся из параметров запуска)
    try {
      const b = window.vkBridge;
      if (b && !(b.isStandalone && b.isStandalone())) {
        const r = await this._send('VKWebAppInit', {}, 2500);
        this.vk = !!(r && r.result !== false);
      }
    } catch (e) { this.vk = false; }
    document.addEventListener('visibilitychange', () => { if (document.hidden) this._flushAll(); });
  },
  get isVK() { return !!this.vk; }, // true только если VKWebAppInit прошёл (вне VK — false, соц-кнопок нет)
  appId() { try { return new URLSearchParams(location.search).get('vk_app_id') || ''; } catch (e) { return ''; } },
  async share(text) { // пост на стену: текст + ссылка на приложение; true — опубликован
    if (!this.vk) return false;
    const p = { message: String(text || '') }, id = this.appId();
    if (/^\d+$/.test(id)) p.attachments = 'https://vk.com/app' + id;
    try { const r = await this._send('VKWebAppShowWallPostBox', p, 600000); return !!(r && r.post_id); } catch (e) { return false; }
  },
  async invite() { // окно приглашения друзей; true — окно отработало без ошибки (закрыл/отменил — false)
    if (!this.vk) return false;
    try { const r = await this._send('VKWebAppShowInviteBox', {}, 600000); return !!(r && r.success !== false); } catch (e) { return false; }
  },
  ready() {}, start() {}, stop() {}, // в VK нет аналога Game Ready / GameplayAPI
  lang() {
    try {
      const v = new URLSearchParams(location.search).get('vk_language');
      if (v === null || v === '') return null; // нет параметра — игра возьмёт navigator.language
      return (v === '0' || v.toLowerCase().slice(0, 2) === 'ru') ? 'ru' : 'en';
    } catch (e) { return null; }
  },
  async _ad(format) {
    if (!this.vk) return false;
    try {
      const c = await this._send('VKWebAppCheckNativeAds', { ad_format: format }, 5000);
      if (!c || !c.result) return false;
    } catch (e) { return false; }
    this.onMute(true);
    try {
      const r = await this._send('VKWebAppShowNativeAds', { ad_format: format }, 120000);
      return !!(r && r.result);
    } catch (e) { return false; }
    finally { this.onMute(false); }
  },
  fullscreen() { return this._ad('interstitial'); },
  rewarded(cb, el) {
    if (!this.vk) { // заглушка вне VK
      let n = 3; this.onMute(true);
      if (!el) { this.onMute(false); return cb(); }
      const txt = this.lang() === 'en' ? 'A rewarded ad will play here' : 'Здесь будет реклама за награду';
      el.innerHTML = `<div><b>${n}</b>${txt}</div>`; el.hidden = false;
      const iv = setInterval(() => { n--; if (n <= 0) { clearInterval(iv); el.hidden = true; this.onMute(false); cb(); } else el.querySelector('b').textContent = n; }, 650);
      return;
    }
    this._ad('reward').then(ok => { if (ok) cb(); });
  },
  _chunks(s) { // режем строку на куски ≤ 4000 байт UTF-8 (лимит VK — 4096)
    const out = []; let cur = '', bytes = 0;
    for (const ch of s) {
      const c = ch.codePointAt(0), b = c < 0x80 ? 1 : c < 0x800 ? 2 : c < 0x10000 ? 3 : 4;
      if (bytes + b > 4000) { out.push(cur); cur = ''; bytes = 0; }
      cur += ch; bytes += b;
    }
    out.push(cur); return out;
  },
  async _write(k) {
    const s = this._pend[k]; delete this._pend[k]; this._last[k] = Date.now();
    if (s === undefined) return;
    const parts = this._chunks(s), cache = this._cache[k] || (this._cache[k] = {});
    try {
      await Promise.all(parts.map((v, i) => cache[i] === v ? null :
        this._send('VKWebAppStorageSet', { key: (k + '_' + i).slice(0, 100), value: v }).then(() => { cache[i] = v; })));
      if (cache.n !== parts.length) { await this._send('VKWebAppStorageSet', { key: k + '_n', value: String(parts.length) }); cache.n = parts.length; }
    } catch (e) { this._cache[k] = {}; }
  },
  _flushAll() { for (const k in this._pend) { clearTimeout(this._timer[k]); this._timer[k] = null; this._write(k); } },
  async save(k, d) {
    const s = JSON.stringify(d);
    try { localStorage.setItem(k, s); } catch (e) {}
    if (!this.vk) return;
    this._pend[k] = s;
    const wait = 4000 - (Date.now() - (this._last[k] || 0)); // в VK не чаще раза в 4 с (лимиты), при сворачивании — сразу
    if (wait <= 0 || document.hidden) { clearTimeout(this._timer[k]); this._timer[k] = null; return this._write(k); }
    if (!this._timer[k]) this._timer[k] = setTimeout(() => { this._timer[k] = null; this._write(k); }, wait);
  },
  async load(k) {
    if (this.vk) {
      try {
        const g = async keys => { const r = await this._send('VKWebAppStorageGet', { keys }); const m = {}; for (const x of (r && r.keys) || []) m[x.key] = x.value; return m; };
        const n = parseInt((await g([k + '_n']))[k + '_n'], 10);
        if (n > 0) {
          const keys = Array.from({ length: n }, (_, i) => k + '_' + i), m = await g(keys);
          if (keys.every(x => typeof m[x] === 'string')) {
            const cache = this._cache[k] = { n }; keys.forEach((x, i) => cache[i] = m[x]);
            const d = JSON.parse(keys.map(x => m[x]).join(''));
            if (d) return d;
          }
        }
      } catch (e) {}
    }
    try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; }
  },
};

/* ===== Словарь: «СЛОВО|короткое определение». Буква Ё в ответах = Е. Темы — для «темы уровня» и «темы дня». ===== */

      почти нет пустых клеток, пересечений ~половина). 2) Заполнение словами из словаря перебором с возвратом.
   Клетка-вопрос держит до 2 вопросов: верхний — слово начинается справа от неё, нижний — снизу.
   Стрелки: R (справа, вправо), RD (справа, вниз), D (снизу, вниз), DR (снизу, вправо).
   Правило: любая полоса из 2+ букв подряд — ровно одно слово из словаря; одиночные буквы между вопросами — часть другого слова. */

    for(let k=0;k<L;k++){const c=grid[s.cells[k]];if(c){const b=ix.pos[k][c];if(!b)return null;for(let j=0;j<ix.nw;j++)m[j]&=b[j]}}return m};

  // буквы слова закрепляем; соседние слова, ставшие верными, тоже засчитываем
  snd('ok');animCells(w.cells,'pop');
  for(const c of w.cells)for(const x of wordsAt(c))if(!ST.sol.includes(x)&&fullW(x)&&rightW(x)){ST.sol.push(x);S.coins+=P.words[x].w.length;S.solvedTotal++;setTimeout(()=>animCells(P.words[x].cells,'pop'),300)}
  if(ST.sol.length>=P.words.length){update();save();setTimeout(win,650);return}
  toast(`${w.w} · +${gain} 🪙`,1200);
  if(wi===aw||solvedSet().has(aw))nextWord(1,true);update();save();
}
function nextWord(dir,quiet){const s=solvedSet(),n=P.words.length;if(s.size>=n)return;let i=aw<0?-1:aw;for(let k=0;k<n;k++){i=(i+dir+n)%n;if(!s.has(i)){selWord(i);break}}if(!quiet)update()}

/* ===== Подсказки ===== */
function hint(){
  const s=solvedSet();let wi=aw;if(wi<0||s.has(wi))wi=P.words.findIndex((w,i)=>!s.has(i));if(wi<0)return false;
  const w=P.words[wi];let t=(w.cells.includes(ac)&&!lockedCell(ac)&&getEnt(ac)!==P.cells[ac].ch)?ac:w.cells.find(c=>!lockedCell(c)&&getEnt(c)!==P.cells[c].ch);
  if(t==null)t=w.cells.find(c=>!lockedCell(c));if(t==null)return false;
  setEnt(t,P.cells[t].ch);ST.lock.push(t);ST.hints++;aw=wi;snd('hint');animCells([t],'pop',0);
  const k=w.cells.indexOf(t);let n=k+1;while(n<w.cells.length&&lockedCell(w.cells[n]))n++;ac=n<w.cells.length?w.cells[n]:t;
  afterChange(t);update();save();return true;
}

/* ===== Победа, подарки ===== */
async function win(){
  aw=-1;ac=-1;update();
  snd('win');confetti();animCells(P.cells.map((c,i)=>c.t==='L'?i:-1).filter(i=>i>=0),'wave',25);
  const st=ST.hints===0?3:ST.hints<=2?2:1;
  if(mode==='day'){
    const first=!ST.done;ST.done=true;const bonus=first?100:0;S.coins+=bonus;save();
    const tom=new Date(Date.now()+864e5);
    setTimeout(()=>{$('ov').innerHTML=`<div class="card"><h2>Кроссворд дня разгадан!</h2><div class="big">📅</div><div class="m">${first?`Награда: <b>+100 монет</b>`:'Награда уже получена сегодня'}<br>Завтра новая тема: <b>${dayTheme(dayKey(tom))}</b></div><button class="btn main" data-a="back">К уровням<small>уровень ${S.lv}</small></button></div>`;$('ov').hidden=false},900);
    return;
  }
  S.stars[S.lv]=Math.max(S.stars[S.lv]||0,st);const bonus=20+P.words.length*2;S.coins+=bonus;
  const doneLv=S.lv;let chest='';const inChest=((doneLv-1)%5)+1;
  if(inChest===5){S.coins+=100;chest=`<div class="m">🧰 Сундук открыт: <b>+100 монет</b></div>`}
  S.lv++;S.cur=null;save();
  const nxt=sizeFor(S.lv),nt=CATS[(S.lv-1)%CATS.length];
  setTimeout(()=>{$('ov').innerHTML=`<div class="card"><h2>Уровень ${doneLv} разгадан!</h2><div class="stars">${'★'.repeat(st)}<s>${'★'.repeat(3-st)}</s></div>
   <div class="m">+${bonus} монет · всего <b>${S.coins} 🪙</b></div>${chest}
   <div class="chest">Сундук: ${[1,2,3,4,5].map(k=>`<i class="${k<=inChest?'f':''}"></i>`).join('')} ${inChest===5?'🎉':'🧰'}</div>
   <button class="btn main" data-a="next">Дальше: уровень ${S.lv}<small>${nt} · ${nxt[0]}×${nxt[1]}</small></button></div>`;$('ov').hidden=false},900);
}
function daily(){
  const today=dayKey(),y=dayKey(new Date(Date.now()-864e5));if(S.realLast===today)return false;
  S.streak=S.realLast===y?S.streak+1:1;S.realLast=today;save();if(S.lv<2&&!S.solvedTotal)return false;
  const g=20*Math.min(7,S.streak);S.coins+=g;save();
  $('ov').innerHTML=`<div class="card"><h2>С возвращением!</h2><div class="big">🎁</div><div class="m">Подарок за <b>${S.streak}-й день подряд</b>: <b>+${g} монет</b>.<br>Заходите каждый день — подарок растёт до 7-го дня.</div>
   <div class="m">Тема дня: <b>${dayTheme(today)}</b></div>
   <div class="bar"><button class="btn" data-a="close">Спасибо</button><button class="btn main" data-a="dayplay">📅 Кроссворд дня<small>+100 монет</small></button></div></div>`;
  $('ov').hidden=false;return true;
}

/* ===== Клавиатура и действия ===== */
const KB=['ЙЦУКЕНГШЩЗХЪ','ФЫВАПРОЛДЖЭ','ЯЧСМИТЬБЮ'];
$('kb').innerHTML=KB.map((r,ri)=>`<div class="kr">${[...r].map(ch=>`<button class="k" data-k="${ch}">${ch}</button>`).join('')}${ri===2?'<button class="k bs" data-k="BS" aria-label="Стереть">⌫</button>':''}</div>`).join('');
const CODE={KeyQ:'Й',KeyW:'Ц',KeyE:'У',KeyR:'К',KeyT:'Е',KeyY:'Н',KeyU:'Г',KeyI:'Ш',KeyO:'Щ',KeyP:'З',BracketLeft:'Х',BracketRight:'Ъ',KeyA:'Ф',KeyS:'Ы',KeyD:'В',KeyF:'А',KeyG:'П',KeyH:'Р',KeyJ:'О',KeyK:'Л',KeyL:'Д',Semicolon:'Ж',Quote:'Э',KeyZ:'Я',KeyX:'Ч',KeyC:'С',KeyV:'М',KeyB:'И',KeyN:'Т',KeyM:'Ь',Comma:'Б',Period:'Ю',Backquote:'Е'};
document.addEventListener('keydown',e=>{if(!P||!$('ov').hidden||!$('adov').hidden||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Backspace'){e.preventDefault();backspace();return}
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key==='Tab'){e.preventDefault();nextWord(1);return}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();nextWord(-1);return}
  let ch=/^[а-яё]$/i.test(e.key)?e.key.toUpperCase().replace('Ё','Е'):CODE[e.code];if(ch){e.preventDefault();typeCh(ch)}});
const A={
 hint:()=>{if(S.coins<30)return toast('Не хватает монет — откройте букву за рекламу');if(hint()){S.coins-=30;update();save()}},
 adhint:()=>YSDK.rewarded(()=>{hint()},$('adov')),
 next:async()=>{$('ov').hidden=true;if(S.lv>3&&(S.lv-1)%2===0)await YSDK.fullscreen();openLevel();save()},
 close:()=>{$('ov').hidden=true},
 back:()=>{$('ov').hidden=true;openLevel()},
 day:()=>{if(mode==='day')openLevel();else openDay()},
 dayplay:()=>{$('ov').hidden=true;openDay()},
 sound:()=>{S.sound=!S.sound;update();save()},
 prev:()=>nextWord(-1),
 nextw:()=>nextWord(1),
};
document.addEventListener('click',e=>{
  const k=e.target.closest('[data-k]');if(k){k.classList.add('pr');setTimeout(()=>k.classList.remove('pr'),120);k.dataset.k==='BS'?backspace():typeCh(k.dataset.k);return}
  const q=e.target.closest('.qx');if(q){tapClue(+q.dataset.w);return}
  const c=e.target.closest('#grid .c.lt');if(c){tapCell(+c.dataset.i);return}
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f)f(el.dataset.x)});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden){save();try{AC&&AC.suspend()}catch(e){}YSDK.stop()}else YSDK.start()});
window.addEventListener('resize',()=>layout());
try{new ResizeObserver(()=>layout()).observe($('board'))}catch(e){}
window.__scan={levelPuzzle,dayPuzzle,DICT,CATS,get P(){return P},get S(){return S},get ST(){return ST},get mode(){return mode},get aw(){return aw},get ac(){return ac}};

(async()=>{
  await YSDK.init(m=>{muted=m;try{m?AC&&AC.suspend():AC&&AC.resume()}catch(e){}});
  const d=await YSDK.load(KEY);S=d&&d.v===1?d:fresh();
  openLevel();const shown=daily();YSDK.ready();YSDK.start();
  if(S.lv===1&&!ST.sol.length&&!shown)toast('Нажмите на клетку и вводите буквы с клавиатуры внизу',3200);
})();
</script>
