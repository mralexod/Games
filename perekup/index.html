<style>
/* Layout: the whole game is the hero's smartphone — status bar, app screen, dock of app icons; chats, tools and mini-games open as full-screen apps above it */
:root{
  --night:#15131a; --wall:#1d1a20; --glass:rgba(255,255,255,.06); --glass2:rgba(255,255,255,.1); --line:rgba(255,255,255,.1);
  --fg:#f3eee4; --muted:#aaa2b0; --amber:#ffbe3b; --amber-ink:#251a05; --sodium:#ff9d2e;
  --good:#5fd38d; --bad:#ff6a55; --gold:#ffd25a;
  --me:#5a4413; --them:#2c2833; --bezel:#09080b;
  --display:"Russo One","Arial Black",system-ui,sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:#0c0b0e;color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.38;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#phone{position:relative;max-width:440px;margin:0 auto;height:100%;display:flex;flex-direction:column;overflow:hidden;
  background:radial-gradient(120% 60% at 85% -10%,rgba(255,157,46,.26),transparent 60%),radial-gradient(90% 50% at 0% 110%,rgba(120,80,255,.16),transparent 60%),linear-gradient(var(--wall),var(--night))}
@media (min-width:700px) and (min-height:640px){#phone{height:min(900px,calc(100% - 32px));margin-top:16px;border-radius:44px;border:11px solid var(--bezel);box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 2px #2a2730}}
#phone.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-1deg)}40%{transform:translateX(7px) rotate(1deg)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.status{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + env(safe-area-inset-top,0px)) 20px 6px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.status .l,.status .r{display:flex;gap:9px;align-items:center}
.status .r{color:var(--muted);font-size:12px}
.status .clock{font-size:15px}
.batt{width:22px;height:11px;border:1.5px solid var(--muted);border-radius:3px;position:relative}
.batt i{position:absolute;top:1.5px;bottom:1.5px;left:1.5px;background:var(--good);border-radius:1px}
.sbtn{font-size:12px;padding:3px 8px;border-radius:8px;background:var(--glass2);color:var(--fg);font-weight:700}
#screen{flex:1;overflow-y:auto;padding:6px 16px 18px;display:grid;align-content:start;grid-auto-rows:max-content;gap:12px;overscroll-behavior:contain}
.dock{margin:0 10px calc(10px + env(safe-area-inset-bottom,0px));padding:8px 6px;border-radius:26px;background:rgba(255,255,255,.08);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.dock button{display:grid;justify-items:center;gap:3px;font-size:10.5px;color:var(--muted);position:relative;padding:2px 0}
.dock button.on{color:var(--fg)}
.app{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 10px rgba(0,0,0,.35)}
.app svg{width:26px;height:26px}
.dock button.on .app{outline:2px solid rgba(255,255,255,.75);outline-offset:2px}
.badge{position:absolute;top:-4px;right:calc(50% - 30px);background:var(--bad);color:#fff;font-size:11px;font-weight:800;border-radius:10px;min-width:19px;height:19px;line-height:19px;padding:0 5px;box-shadow:0 0 0 2px var(--night)}
.pulse{animation:pulse 1.3s infinite}
@keyframes pulse{50%{transform:scale(1.07);box-shadow:0 0 0 7px rgba(255,190,59,.3)}}
.dock button.lk .app{filter:grayscale(1) brightness(.55)}
.dock .lkI{position:absolute;top:-4px;right:calc(50% - 30px);font-size:13px;font-style:normal}
.dock small{font-size:9px;line-height:1;margin-top:-2px;opacity:.85}
.btn.lockd{opacity:.5;filter:grayscale(1)}
#push.unl span{white-space:normal}
h2{font-family:var(--display);font-weight:400;font-size:22px;margin:2px 0 0;letter-spacing:.3px;text-wrap:balance;line-height:1.1}
.sub{color:var(--muted);font-size:13px;margin-top:-6px}
.w{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:14px;display:grid;gap:8px}
.lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.money{font-family:var(--display);font-size:34px;line-height:1;color:var(--amber);font-variant-numeric:tabular-nums;text-shadow:0 0 24px rgba(255,190,59,.35)}
.stars{color:var(--gold);letter-spacing:2px;font-size:15px}
.stars s{color:rgba(255,255,255,.2);text-decoration:none}
.bar{height:8px;background:rgba(255,255,255,.08);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sodium),var(--amber));border-radius:5px}
.nw{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.nw b{font-family:var(--display);font-weight:400;font-size:13px;border-radius:7px;padding:2px 7px;flex:none}
.nw b.up{background:rgba(95,211,141,.18);color:var(--good)} .nw b.dn{background:rgba(255,106,85,.18);color:var(--bad)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{background:var(--amber);color:var(--amber-ink);border-radius:16px;padding:11px 13px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:flex-start;box-shadow:0 8px 24px rgba(255,190,59,.25)}
.hint b{font-family:var(--display);font-weight:400;font-size:12px;background:var(--amber-ink);color:var(--amber);border-radius:6px;padding:2px 7px;flex:none;margin-top:1px}
.card{background:rgba(20,18,24,.75);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;text-align:left;width:100%}
.card .body{padding:11px 13px 13px;display:grid;gap:5px;min-width:0}
.ttl{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.t{font-weight:800;font-size:17px}
.price{font-family:var(--display);font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums;white-space:nowrap}
.m{color:var(--muted);font-size:13px}
.q{font-size:13px;opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.photo{position:relative;background:#211e26}
.photo canvas,.ph canvas,.cvbox canvas{display:block;width:100%;height:auto}
.photo .tags{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;right:10px}
.photo .plate{position:absolute;right:10px;bottom:8px}
.tag{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.6);color:var(--fg)}
.tag.new{background:var(--amber);color:var(--amber-ink)} .tag.hot{background:var(--bad);color:#fff}
.tag.up{background:var(--good);color:#06210f} .tag.dn{background:var(--bad);color:#2a0702}
.tag.good{background:rgba(95,211,141,.18);color:var(--good)} .tag.bad{background:rgba(255,106,85,.18);color:var(--bad)}
.tag.gold{background:var(--gold);color:#2a1d00}
.plate{display:inline-flex;align-items:stretch;border:1.5px solid #15171c;border-radius:4px;background:#f6f5f0;color:#15171c;font-family:var(--display);font-size:11px;line-height:1;overflow:hidden}
.plate .n{padding:3px 5px;letter-spacing:.5px}
.plate .r{border-left:1.5px solid #15171c;padding:1px 3px;display:grid;justify-items:center;font-size:8px;gap:1px}
.plate .r i{display:block;width:12px;height:4px;background:linear-gradient(#f6f5f0 0 33%,#2a56b8 33% 66%,#cf3a32 66%)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:14px;font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--muted)}
.btn{background:var(--glass2);border:1px solid var(--line);border-radius:14px;padding:10px 13px;font-weight:700;font-size:14px;text-align:center;line-height:1.2}
.btn.main{background:linear-gradient(var(--amber),#f0a21f);border-color:transparent;color:var(--amber-ink);box-shadow:0 6px 18px rgba(255,190,59,.22)}
.btn.warn{color:var(--bad)}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.sel{outline:2px solid var(--amber);background:rgba(255,190,59,.14)}
.btn[disabled]{opacity:.4;cursor:default}
.btn small{display:block;font-weight:500;font-size:12px;opacity:.8;margin-top:2px}
.grow{flex:1 1 auto}
.def{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;background:var(--glass);border-radius:12px;padding:8px 10px}
.def.fixed{opacity:.55}
.empty{color:var(--muted);text-align:center;padding:26px 14px;border:1px dashed var(--line);border-radius:20px}
.thread{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:18px;background:var(--glass);border:1px solid var(--line);text-align:left;width:100%}
.thread .x{min-width:0}
.thread .x b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread .x span{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ava{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:16px;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad)}
/* overlays */
#ov{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column}
#ov.dim{background:rgba(5,4,8,.65);justify-content:center;padding:16px}
.sheet{flex:1;display:flex;flex-direction:column;background:linear-gradient(#1c1921,#141218);animation:slide .22s ease-out;min-height:0}
@keyframes slide{from{transform:translateY(24px);opacity:.3}}
.modal{background:linear-gradient(#26222c,#1a171e);border:1px solid var(--line);border-radius:26px;padding:18px;display:grid;gap:12px;animation:slide .25s ease-out;max-height:100%;overflow-y:auto}
.modal .big{font-family:var(--display);font-size:24px;color:var(--amber);text-wrap:balance;line-height:1.15}
.chead{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.03)}
.back{font-size:30px;line-height:1;padding:0 8px 4px 2px;color:var(--amber)}
.who{min-width:0;flex:1}
.who b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12px;color:var(--muted)}
.who span.on{color:var(--good)}
.item{display:flex;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.ph{width:96px;flex:none;border-radius:10px;overflow:hidden;background:#24212a}
.item .x{min-width:0;font-size:13px;color:var(--muted)}
.item .x b{color:var(--fg);font-size:14px;display:block}
.msgs>*{flex-shrink:0}
.card.tap{cursor:pointer}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;min-height:0}
.b{max-width:84%;padding:8px 12px;border-radius:18px;font-size:15px;white-space:pre-line}
.b.them{background:var(--them);align-self:flex-start;border-bottom-left-radius:5px}
.b.me{background:var(--me);align-self:flex-end;border-bottom-right-radius:5px}
.b.sys{align-self:center;background:none;color:var(--muted);font-size:13px;text-align:center;max-width:94%;padding:2px 8px}
.b.sys.ok{color:var(--good)} .b.sys.no{color:var(--bad)}
.b.pop{animation:pop .28s ease-out both}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}}
.typing{align-self:flex-start;background:var(--them);border-radius:18px;padding:11px 14px;display:flex;gap:4px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:td 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes td{50%{opacity:.25;transform:translateY(-3px)}}
.panel{border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:9px;background:rgba(255,255,255,.04)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips .btn{flex:none;padding:8px 11px;font-size:13px;border-radius:999px}
.offer{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.offer .val{font-family:var(--display);font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:110px;text-align:right}
input[type=range]{width:100%;accent-color:var(--amber);height:28px;margin:0}
.pat{font-size:12px;color:var(--muted);display:flex;gap:5px;align-items:center}
.pat i{width:9px;height:9px;border-radius:50%;background:var(--good)}
.pat i.off{background:rgba(255,255,255,.15)}
.tools{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:12px;display:grid;gap:3px;text-align:left}
.tool b{font-family:var(--display);font-weight:400;font-size:15px}
.tool span{font-size:12px;color:var(--muted)}
.tool.used{border-color:var(--amber);background:rgba(255,190,59,.08)}
.res{background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:6px;font-size:14px;font-variant-numeric:tabular-nums}
.bad{color:var(--bad)} .ok{color:var(--good)}
.cvbox{position:relative;background:linear-gradient(#2b2730,#18161c);border-radius:16px;overflow:hidden}
.pt{position:absolute;transform:translate(-50%,-50%);min-width:32px;height:28px;border-radius:14px;padding:0 6px;background:rgba(10,10,14,.8);border:2px solid var(--amber);color:var(--fg);font-size:11px;font-weight:800;display:grid;place-items:center;white-space:nowrap}
.pt.bad{border-color:var(--bad);background:var(--bad);color:#fff}
.pt.ok{border-color:var(--good)}
.scan{position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(95,211,141,.35),transparent);animation:scan .9s linear infinite}
@keyframes scan{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pts{border-radius:14px;padding:12px;background:#efe6cf;color:#3b2a14;font-size:13px;display:grid;gap:4px;font-variant-numeric:tabular-nums;position:relative;overflow:hidden}
.pts .hd{font-weight:800;color:#a3271d;letter-spacing:.06em;font-size:12px}
.pts .stamp{position:absolute;right:10px;top:22px;border:3px solid #c0261b;color:#c0261b;font-family:var(--display);padding:2px 8px;transform:rotate(-12deg);font-size:15px;opacity:.85}
.wash{touch-action:none}
.wash canvas{display:block;width:100%;touch-action:none}
.wash .dirt{position:absolute;inset:0;width:100%;height:100%}
.legend{display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
/* push, fx */
#push{position:absolute;left:10px;right:10px;top:calc(8px + env(safe-area-inset-top,0px));z-index:8;background:rgba(40,36,46,.96);border:1px solid var(--line);border-radius:20px;padding:10px 12px;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:center;text-align:left;box-shadow:0 12px 30px rgba(0,0,0,.5);animation:drop .3s ease-out}
@keyframes drop{from{transform:translateY(-120%)}}
#push .app{width:36px;height:36px;border-radius:10px}
#push .app svg{width:20px;height:20px}
#push b{display:block;font-size:13px}
#push span{font-size:14px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{pointer-events:none;position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:#16131a;font-weight:700;padding:10px 14px;border-radius:14px;width:max-content;max-width:calc(100% - 32px);z-index:9;font-size:14px;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#adov{position:absolute;inset:0;background:#000;color:#fff;display:grid;place-items:center;z-index:10;text-align:center;padding:24px;font-size:15px}
#adov b{font-family:var(--display);font-size:46px;display:block;margin-bottom:8px;color:var(--amber)}
#fx{position:absolute;inset:0;pointer-events:none;z-index:11;overflow:hidden}
.coin{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc531 45%,#c47d00);box-shadow:0 0 10px rgba(255,190,59,.7);font-size:12px;font-weight:900;color:#7a4a00;display:grid;place-items:center}
.conf{position:absolute;width:8px;height:12px;border-radius:2px}
.foot{color:var(--muted);font-size:12px;text-align:center;padding-top:4px}
.foot button{color:var(--muted);text-decoration:underline}
.bassy canvas{animation:bass .28s ease-in-out infinite alternate}
@keyframes bass{to{transform:translateY(1.6px) scaleY(.994)}}
.hs{position:absolute;transform:translate(-50%,-50%);width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--good) calc(var(--p,0)*1%),rgba(255,255,255,.18) 0);display:grid;place-items:center;box-shadow:0 0 0 4px rgba(0,0,0,.35),0 0 26px rgba(255,190,59,.55);touch-action:manipulation}
.hs span{width:46px;height:46px;border-radius:50%;background:rgba(20,18,24,.92);display:grid;place-items:center;font-size:22px;animation:pulse 1.1s infinite}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#ffd25a;box-shadow:0 0 8px #ffbe3b}
.flt{position:absolute;font-family:var(--display);color:var(--good);font-size:19px;text-shadow:0 2px 8px rgba(0,0,0,.7);white-space:nowrap}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--glass);padding:4px;border-radius:14px}
.tabs button{padding:9px;border-radius:10px;font-weight:800;font-size:14px;color:var(--muted)}
.tabs button.on{background:var(--amber);color:var(--amber-ink)}
.sw{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.25);position:relative}
.sw.on{border-color:var(--amber);box-shadow:0 0 0 3px rgba(255,190,59,.3)}
.sw i{position:absolute;right:-6px;top:-8px;font-style:normal;font-size:15px}
.part{display:grid;gap:6px}
.part .btn{padding:8px 10px;font-size:13px}
.ponty{font-family:var(--display);font-size:28px;color:#ff8be0;text-shadow:0 0 18px rgba(255,90,200,.55)}
.tag.ptag{background:#ff8be0;color:#2a0020}
.album{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.album canvas{display:block;width:100%;height:auto}
.album .it{min-width:0}
.album .it{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:8px;display:grid;gap:3px;text-align:center;font-size:13px}
.qst{display:grid;gap:5px;font-size:14px}
.qst .row{justify-content:space-between;flex-wrap:nowrap}
.qst.done{opacity:.55}
button.w{text-align:left;width:100%}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

function genBuyer(car,type){

    const now=AC.currentTime,tone=(f,f2,d,type='sine',v=.08,at=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,now+at);if(f2)o.frequency.exponentialRampToValueAtTime(f2,now+at+d);g.gain.setValueAtTime(v,now+at);g.gain.exponentialRampToValueAtTime(.0001,now+at+d);o.connect(g).connect(AC.destination);o.start(now+at);o.stop(now+at+d+.02)};

const clockRuns=()=>!paused&&!document.hidden&&S.tut>=4&&!(ui.ov&&(ui.ov.k==='summary'||ui.ov.k==='event'||ui.ov.k==='wash'||ui.ov.k==='gift'));
function tick(){
  if(!S||!clockRuns())return;
  S.time++;
  while(S.sched.length&&S.sched[0].t<=S.time){const e=S.sched.shift();
    if(e.k==='listing'){const L0=genListing();S.board.unshift(L0);ui.dirty=true;if(Math.random()<.6||L0.hot)push('bazar',L0.hot?'🔥 Горячее объявление':'Барахолка',`${mname(L0.car)} · ${rub(L0.ask)} · ${L0.dist}`,{k:'seller',id:L0.uid})}
    if(e.k==='event'){if(ui.ov){S.sched.push({t:S.time+15,k:'event'});S.sched.sort((a,b)=>a.t-b.t)}else fireEvent()}
  }
  if(S.time%25===0&&ui.tab==='garage')ui.dirty=true;
  for(const L0 of S.board) if(!L0.gone&&S.time>=L0.until){L0.gone=true;L0.reason='sniped';ui.dirty=true;if(ui.ov&&ui.ov.id===L0.uid)ui.ovTouched=true;
    if(L0.msgs.length>1){L0.msgs.push({w:'them',t:pick(L.sniped),ts:Date.now()});L0.unread=true;L0.lt=stamp();push('chats',L0.name,'Тачку уже забрали…',{k:'seller',id:L0.uid})}}
  for(const car of S.garage) if(car.listed){
    const rate=buyRate(car);car.views+=rate*R(4,14)/60;
    const active=S.inbox.filter(b=>b.car===car.uid&&isOpen(b)).length;
    const force=S.tut===4&&!S.inbox.length&&S.time>=(car.forceAt||0);
    if(active<3&&(force||Math.random()<rate/60)){const b=genBuyer(car,force?'adekvat':null);S.inbox.unshift(b);ui.dirty=true;push('chats',b.name,b.msgs[0].t,{k:'buyer',id:b.uid})}
  }
  if(S.time>=900&&!(ui.ov&&ui.ov.k==='summary')){ui.ov={k:'summary'};snd('win');renderOv()}
  renderStatus();updateTimers();
  if(ui.dirty){ui.dirty=false;renderDock();if(!ui.ov)renderScreen();else if(ui.ovTouched&&!ui.typing){ui.ovTouched=false;renderOv()}}
  if(S.time%10===0)save();
}
const isOpen=b=>b.stage==='offer'||b.stage==='found';
function buyRate(car){
  const ratio=car.listed/Math.max(1,bestVal(car,false));
  const ad=car.ad||{bg:'garage',ph:[]};
  let attract=BG[ad.bg].k*ad.ph.reduce((a,p)=>a*PHRASES[p].k,1);
  if(ad.bg==='night'&&car.dirt>.15)attract*=.8;
  if(car.dirt>.15)attract*=.85;
  if(car.boost===S.day)attract*=2;
  return clamp((1.4-ratio)*.75,.05,1.1)*attract*(.8+.1*S.rep);
}

  S.stats.deals++;S.stats.profit+=profit;S.stats.best=Math.max(S.stats.best,profit);S.dayStats.deals++;S.dayStats.profit+=profit;quest('sell',1);quest('profit',0);if(ponty(car)>=40)quest('tunesale',1);
  S.rep=Math.min(5,S.rep+.15);
  S.garage=S.garage.filter(c=>c.uid!==car.uid);
  sayThem(B,pick(['Всё, забираю! Спасибо, удачи!','Отлично, деньги передал. Погнал!','Машина огонь, спасибо, брат!']));
  saySys(B,`Продано за ${rub(p)}. ${profit>=0?'Прибыль':'Убыток'}: ${rub(profit)}`,profit>=0?'ok':'no');
  B.stage='done';B.sale={profit,bonus:false};
  for(const o of S.inbox)if(o!==B&&o.car===car.uid&&isOpen(o)){o.stage='gone';saySys(o,'Тачка уже продана другому покупателю.')}
  if(profit>0){coins(Math.min(18,6+Math.floor(profit/10000)));snd('coin')}else snd('bad');
  const lv=level();if(lv[0]>0&&S.stats.profit-profit<lv[0]){setTimeout(()=>{confetti();snd('win');toast(`Новое звание: ${lv[1]}!`)},700)}
  if(S.tut<5){S.tut=5;setTimeout(()=>{confetti();toast('Первая сделка! Так и становятся перекупами.')},500)}
}

function initWash(){
  const box=document.getElementById('washbox'),d=document.getElementById('dirt');if(!box||!d)return;
  const car=S.garage.find(c=>c.uid===ui.ov.id),paint=ui.ov.paint!=null,lbl=paint?'Покрашено':'Отмыто';const w=box.clientWidth,h=box.clientHeight,dpr=Math.min(2,window.devicePixelRatio||1);
  let c;
  if(paint){drawCar(d,car,{h:.55,bgOff:true,noShine:true});c=d.getContext('2d')}
  else{d.width=w*dpr;d.height=h*dpr;c=d.getContext('2d');
  const ratio=.55,s=w*dpr/240;c.setTransform(s,0,0,s,0,0);
  const oy=(240*ratio-110)/2+6;c.save();c.translate(0,oy);const sc=model(car).sc||1;c.translate(120*(1-sc),100*(1-sc));c.scale(sc,sc);c.translate(0,[0,2.5,5][tn(car).low||0]);
  bodyPath(c,model(car).kind);c.clip();paintDirt(c,Math.max(.7,car.dirt),rng(car.seed+11));c.fillStyle='rgba(70,52,30,.55)';c.fillRect(0,0,240,110);c.restore()}
  const total=countDirt(c,d);let moves=0,down=false,done=false;
  const scrub=e=>{if(!down)return;const r=d.getBoundingClientRect();const x=(e.clientX-r.left)*dpr,y=(e.clientY-r.top)*dpr;
    c.save();c.setTransform(1,0,0,1,0,0);c.globalCompositeOperation='destination-out';c.beginPath();c.arc(x,y,22*dpr,0,7);c.fill();c.restore();
    if(++moves%6===0){const p=1-countDirt(c,d)/Math.max(1,total);document.getElementById('washbar').style.width=Math.round(p*100)+'%';document.getElementById('washtxt').textContent=`${lbl} ${Math.round(p*100)}%`;
      if(p>=.85&&!done){done=true;finishWash(car)}}};
  d.addEventListener('pointerdown',e=>{down=true;d.setPointerCapture(e.pointerId);scrub(e)});
  d.addEventListener('pointermove',scrub);d.addEventListener('pointerup',()=>down=false);d.addEventListener('pointercancel',()=>down=false);
}
function countDirt(c,d){const im=c.getImageData(0,0,d.width,d.height).data;let n=0;for(let i=3;i<im.length;i+=64)if(im[i]>30)n++;return n}
function finishWash(car){
  const pi=ui.ov.paint;
  if(pi!=null){const cost=paintCost(car);S.money=Math.max(0,S.money-cost);car.spent+=cost;car.color=pi;car.painted=true;const d=car.defs.find(x=>x.id==='dtp');if(d){d.fixed=true;d.known=true}quest('paint',1);toast(`Перекрашено в «${COLORS[pi][1]}»!${S.news&&S.news.color===pi?' Цвет в тренде: +8%.':''}`)}
  else{const cost=washCost(car);S.money=Math.max(0,S.money-cost);car.spent+=cost;car.dirt=0;toast(`Блестит! +4% к цене. Мойка ${rub(cost)}.`);if(S.tut===2)S.tut=3}

function openLot(cls,cost){
  if(S.garage.length>=S.slots)return toast('Гараж забит. Освободи место.');
  if(S.money<cost)return toast(`Не хватает ${rub(cost-S.money)}.`);
  S.money-=cost;
  const car=genCar(cls,{nDef:wpick([[0,.15],[1,.3],[2,.35],[3,.2]]),legend:cls===0&&Math.random()<.04,m:undefined});
  car.defs.forEach(d=>d.known=true);car.diag=true;car.bought=cost;S.garage.push(car);own(car);
  ui.ov={k:'reveal',id:car.uid,cost,open:false};save();render();
}

   ui.scrapArm=null;S.money+=p;const pr=p-c.bought-c.spent;S.stats.profit+=pr;S.dayStats.profit+=pr;S.garage=S.garage.filter(z=>z!==c);
   for(const b of S.inbox)if(b.car===c.uid&&isOpen(b))b.stage='gone';toast(`Сдал на разбор за ${rub(p)}.`);commit()},
 slot:()=>{const p=[40000,120000,300000,800000][S.slots-2];if(S.money<p)return toast(`Не хватает ${rub(p-S.money)}.`);S.money-=p;S.slots++;snd('win');toast('Гараж стал больше!');commit()},
 eye:()=>{const p=[80000,250000][S.eye];if(S.money<p)return toast(`Не хватает ${rub(p-S.money)}.`);S.money-=p;S.eye++;snd('win');toast('Глаз намётан: +1 действие на осмотре.');commit()},
 lot:x=>openLot(+x,CLASSES[+x].lot),
 shop:x=>{if(ui.newApps)delete ui.newApps.shop;ui.ov={k:'shop',id:+x};ui.shopTab=ui.shopTab||'repair';render()},
 toshop:()=>{ui.ov={k:'shop',id:ui.ov.id};render()},
 stab:x=>{ui.shopTab=x;renderOv()},
 album:()=>{ui.ov={k:'album'};render()},
 giftok:()=>{closeOv();coins(12);snd('coin')},
 repstart:(x,y)=>{const car=S.garage.find(c=>c.uid===ui.ov.id),cost=fixCost(car,y);if(S.money<cost)return toast('Не хватает денег на запчасти.');S.money-=cost;car.spent+=cost;ui.rep={car:car.uid,id:y,n:0,need:Math.round(10+DEF[y].hit*45)};snd('coin');commit()},
 tap:()=>{const R0=ui.rep;if(!R0)return;R0.n++;const hs=document.getElementById('hs');sparks(hs);snd('tap');if(hs)hs.style.setProperty('--p',Math.round(R0.n/R0.need*100));const rn=document.getElementById('repn');if(rn)rn.textContent=`${R0.n}/${R0.need}`;try{navigator.vibrate&&navigator.vibrate(12)}catch(e){}
   if(R0.n>=R0.need){const car=S.garage.find(c=>c.uid===R0.car);const d=car.defs.find(z=>z.id===R0.id);d.fixed=true;ui.rep=null;floatText(hs,'+'+rub(k1(DEF[R0.id].hit*model(car).base*yk(car))));confetti();snd('win');quest('repair',1);toast(`Готово: ${DEF[R0.id].n}! Тачка подорожала.`);setTimeout(commit,400)}},
 paint:x=>{const car=S.garage.find(c=>c.uid===ui.ov.id),i=+x;if(i===car.color)return;if(S.money<paintCost(car))return toast('Не хватает на краску.');ui.ov={k:'wash',id:car.uid,paint:i};render()},
 part:(x,y)=>{const car=S.garage.find(c=>c.uid===ui.ov.id),i=+y,T=tn(car);if((T[x]||0)===i)return;const cost=partCost(car,x,i);if(S.money<cost)return toast(`Не хватает ${rub(cost-S.money)}.`);
   S.money-=cost;car.spent+=cost;car.tuneSpent=(car.tuneSpent||0)+cost;T[x]=i;if(i){quest('tune',1);confetti();snd('win');floatText(document.querySelector('#ov .cvbox'),'+'+PARTS[x].o[i][2]+' 🔥')}else snd('msg');if(x==='bass'&&i)toast('Басы качают! Тачка трясётся 🔊');commit()},
 freelot:()=>{if(S.freeLot>=S.day)return;if(S.garage.length>=S.slots)return toast('Гараж забит. Освободи место.');showAd(()=>{S.freeLot=S.day;openLot(0,0)})},
 untarp:()=>{const car=S.garage.find(c=>c.uid===ui.ov.id);ui.ov.open=true;renderOv();const v=val(car,true);if(car.legend||v>ui.ov.cost*1.3||ui.ov.cost===0){confetti();snd('win')}else if(v<ui.ov.cost*.75){shake();snd('bad')}else snd('coin')},
 evch:x=>{const c=ui.ov.e.ch[+x];c.f();save();render()},
 reset:()=>{if(!ui.resetArm){ui.resetArm=true;renderScreen();return}ui.resetArm=false;try{localStorage.removeItem(KEY)}catch(e){}newGame();ui.ov=null;ui.tab='home';render();toast('Новая игра. Удачи, перекуп!')},
};
document.addEventListener('click',e=>{
  if(e.target.closest('#push')){const g=ui.push&&ui.push.go;document.getElementById('push').hidden=true;if(g){if(g.k==='seller'&&S.board.some(l=>l.uid===g.id)){ui.ov={k:'seller',id:g.id}}else if(g.k==='buyer'){ui.ov={k:'buyer',id:g.id}}render()}return}
  const el=e.target.closest('[data-a]');if(!el||el.disabled)return;
  const f=A[el.dataset.a];if(f)f(el.dataset.x,el.dataset.y);
});
document.addEventListener('input',e=>{
  const el=e.target;if(el.dataset.in==='offer'){ui.offer[el.dataset.x]=+el.value;const v=document.getElementById('offv');if(v)v.textContent=rub(+el.value)}
  if(el.dataset.in==='sellf'){ui.sell.f=+el.value;const car=S.garage.find(c=>c.uid===ui.ov.id);el.nextElementSibling.textContent=rub(k1(bestVal(car,true)*ui.sell.f))}
});
document.addEventListener('change',e=>{if(e.target.dataset.in==='sellf')renderOv()});
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.card.tap')){e.preventDefault();e.target.click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){try{AC&&AC.suspend()}catch(e){}save()}});

/* ================= СТАРТ ================= */
function start(data){
  S=(data&&data.v===2)?data:load();
  if(!S)newGame();
  if(!S.album){S.album={};for(const c of S.garage)S.album[c.m]=1}
  if(!S.apps){const old=S.tut>0||S.day>1||S.garage.length>0||S.stats.deals>0;S.apps=old?{garage:1,chats:1,shop:1,auction:1}:{}}
  if(!S.quests)S.quests=genQuests();
  if(!ui.ov)dailyGift();
  window.claude?.hot?.snapshot?.(()=>S);
  render();
  setInterval(tick,200);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??null);
</script>
